[package]
name = "knit-md-docx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Knit Markdown (CommonMark + GitHub Flavored Markdown) into a Word .docx with high fidelity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danganhtu01/rust_knit_md_docx"
readme = "README.md"
keywords = ["markdown", "docx", "word", "commonmark", "gfm"]
categories = ["text-processing", "command-line-utilities"]
exclude = ["/.github", "/tests/output", "/examples/output"]

[lib]
name = "knit_md_docx"
path = "src/lib.rs"

[[bin]]
name = "knit-md-docx"
path = "src/main.rs"
# The binary is the only thing that needs clap. Without this, `cargo build` and
# `cargo test` fail whenever the `cli` feature is off, because `src/main.rs`
# imports clap unconditionally.
required-features = ["cli"]

[dependencies]
# Forked docx-rs with native OMML (oMath) equations, run-level
# superscript/subscript, and paragraph borders for thematic breaks.
#
# Path, not registry: the fork is kept in-repo by owner decision, and the crate
# is renamed on crates.io side anyway — the package here is `knit-md-docx-rs`,
# so the dependency key needs an explicit `package =`. Aliased back to `docx-rs`
# so the `use docx_rs::*` imports throughout the crate stay unchanged.
docx-rs = { package = "knit-md-docx-rs", path = "../knit-md-docx-rs/docx-core" }
pulldown-cmark = { version = "0.13.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
# Theme files. `src/config.rs` is a library module (`mod config;` in lib.rs), so
# these are unconditional — they are not part of the optional `cli` surface.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
# The library is the point; the CLI is a convenience. Consumers that embed this
# crate (ff-lc-app knits markdown in-process) should not build clap.
default = ["cli"]
cli = ["dep:clap"]

[dev-dependencies]
zip = "0.6"

[profile.release]
opt-level = 3
lto = true
