[package]
name = "knit-md-docx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Knit Markdown (CommonMark + GitHub Flavored Markdown) into a Word .docx with high fidelity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danganhtu01/knit-md-docx"
readme = "README.md"
keywords = ["markdown", "docx", "word", "commonmark", "gfm"]
categories = ["text-processing", "command-line-utilities"]
exclude = ["/.github", "/tests/output", "/examples/output"]

[lib]
name = "knit_md_docx"
path = "src/lib.rs"

[[bin]]
name = "knit-md-docx"
path = "src/main.rs"

[dependencies]
# Forked docx-rs with native OMML (oMath) equations, run-level
# superscript/subscript, and paragraph borders for thematic breaks.
# The fork's package is `knit-md-docx-rs`; aliased back to `docx-rs` here so the
# `use docx_rs::*` imports throughout the crate stay unchanged.
# See https://github.com/danganhtu01/knit-md-docx-rs
docx-rs = { version = "0.4.20", package = "knit-md-docx-rs" }
pulldown-cmark = { version = "0.13.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
zip = "0.6"

[profile.release]
opt-level = 3
lto = true
