# Release: push a tag vX.Y.Z matching Cargo.toml's version, and this builds the CLI for
# terminal-config (os-config installs it on every machine, R-0930/R-0932) and publishes
#   knit-md-docx-x86_64-unknown-linux-musl.tar.gz   the bare binary, static
#   knit-md-docx-x86_64-pc-windows-msvc.zip         knit-md-docx.exe at the zip root
#   SHA256SUMS
# The docx-rs fork is a path dependency on ../knit-md-docx-rs/docx-core, so the fork is
# checked out beside this repository at the commit DOCX_RS_REV names.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: knit-md-docx

      - name: Read the pinned docx-rs commit
        id: rev
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < knit-md-docx/DOCX_RS_REV)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: danganhtu01/knit-md-docx-rs
          ref: ${{ steps.rev.outputs.rev }}
          path: knit-md-docx-rs

      - name: The tag must match Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' knit-md-docx/Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        working-directory: knit-md-docx
        run: cargo test --locked

      - name: Build
        working-directory: knit-md-docx
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bin=knit-md-docx/target/${{ matrix.target }}/release/knit-md-docx
          [ "$("$bin" --version)" = "$VERSION" ] || { echo "--version is not $VERSION"; exit 1; }
          mkdir -p dist
          tar -C "$(dirname "$bin")" -czf dist/knit-md-docx-${{ matrix.target }}.tar.gz knit-md-docx

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "knit-md-docx/target/${{ matrix.target }}/release/knit-md-docx.exe"
          $v = & $bin --version
          if ($v -ne $env:VERSION) { throw "--version is '$v', not $env:VERSION" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $bin -DestinationPath dist/knit-md-docx-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum knit-md-docx-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes "knit-md-docx $GITHUB_REF_NAME: a static Linux x86_64 binary, a Windows x86_64 zip, and SHA256SUMS."
